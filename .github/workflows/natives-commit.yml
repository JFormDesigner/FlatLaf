# https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions

name: Native Libraries Commit

on:
  workflow_dispatch:
    inputs:
      windows:
        description: 'Commit Windows libraries'
        default: false
        type: boolean
      macos:
        description: 'Commit macOS libraries'
        default: false
        type: boolean
      linux:
        description: 'Commit Linux libraries'
        default: false
        type: boolean
      message:
        description: 'Commit message'
        required: true
        default: 'Native libraries updated'
        type: string

permissions:
  contents: write
  actions: read

jobs:
  Commit:
    runs-on: ubuntu-latest

    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}

    steps:
      - uses: actions/checkout@v7
        with:
          # commit history is necessary to compare with commit of workflow run,
          # but file contents of old commits are not
          fetch-depth: 0
          filter: blob:none
          # only native libraries are modified, other files are not needed in working tree
          sparse-checkout: flatlaf-core/src/main/resources/com/formdev/flatlaf/natives
          # used for push; commits pushed with GITHUB_TOKEN do not trigger workflow CI
          # (requires fine-grained personal access token with permission "Contents: Read and write")
          token: ${{ secrets.NATIVES_COMMIT_TOKEN || github.token }}

      - name: Check workflow runs
        env:
          WINDOWS: ${{ inputs.windows }}
          MACOS: ${{ inputs.macos }}
          LINUX: ${{ inputs.linux }}
        run: |
          # find latest successful run of platform workflow and check that it is up-to-date
          checkRun() {
              PLATFORM=$1
              PLATFORM_NAME=$2
              WORKFLOW=natives-$PLATFORM.yml

              RUN_INFO=$(gh run list --workflow "$WORKFLOW" --branch "$GITHUB_REF_NAME" --status success --limit 1 --json databaseId,headSha --jq '.[] | "\(.databaseId) \(.headSha)"')
              if [ -z "$RUN_INFO" ]; then
                  echo "::error::No successful run of $WORKFLOW found on branch $GITHUB_REF_NAME"
                  exit 1
              fi
              read -r RUN_ID RUN_SHA <<< "$RUN_INFO"

              if ! git merge-base --is-ancestor "$RUN_SHA" HEAD; then
                  echo "::error::Run $RUN_ID of $WORKFLOW was built from commit $RUN_SHA, which is not part of branch $GITHUB_REF_NAME"
                  exit 1
              fi
              if ! git diff --quiet "$RUN_SHA" HEAD -- "flatlaf-natives/flatlaf-natives-$PLATFORM"; then
                  echo "::error::flatlaf-natives-$PLATFORM has changed since commit $RUN_SHA of run $RUN_ID of $WORKFLOW"
                  exit 1
              fi

              echo "Using run $RUN_ID of $WORKFLOW of commit $RUN_SHA"
              echo "${PLATFORM^^}_RUN_ID=$RUN_ID" >> $GITHUB_ENV
              echo "$PLATFORM_NAME built by $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$RUN_ID from commit $RUN_SHA" >> "$RUNNER_TEMP/built-by.txt"
          }

          if [ "$WINDOWS" = "true" ]; then
              checkRun windows Windows
          fi
          if [ "$MACOS" = "true" ]; then
              checkRun macos macOS
          fi
          if [ "$LINUX" = "true" ]; then
              checkRun linux Linux
          fi

      - name: Copy native libraries from artifacts
        env:
          WINDOWS: ${{ inputs.windows }}
          MACOS: ${{ inputs.macos }}
          LINUX: ${{ inputs.linux }}
        run: |
          DEST=flatlaf-core/src/main/resources/com/formdev/flatlaf/natives

          # cp keeps the mode of existing files, which is lost in artifacts
          copyNatives() {
              RUN_ID=$1
              ARTIFACT=$2
              shift 2
              gh run download "$RUN_ID" --name "$ARTIFACT" --dir "$RUNNER_TEMP/$ARTIFACT"
              for FILE in "$@"; do
                  cp "$RUNNER_TEMP/$ARTIFACT/$DEST/$FILE" "$DEST/$FILE"
              done
          }

          if [ "$WINDOWS" = "true" ]; then
              copyNatives "$WINDOWS_RUN_ID" FlatLaf-natives-build-artifacts-windows-latest \
                  flatlaf-windows-arm64.dll flatlaf-windows-x86.dll flatlaf-windows-x86_64.dll
          fi
          if [ "$MACOS" = "true" ]; then
              copyNatives "$MACOS_RUN_ID" FlatLaf-natives-build-artifacts-macos-latest \
                  libflatlaf-macos-arm64.dylib libflatlaf-macos-x86_64.dylib
          fi
          if [ "$LINUX" = "true" ]; then
              copyNatives "$LINUX_RUN_ID" FlatLaf-natives-build-artifacts-ubuntu-latest libflatlaf-linux-x86_64.so
              copyNatives "$LINUX_RUN_ID" FlatLaf-natives-build-artifacts-ubuntu-24.04-arm libflatlaf-linux-arm64.so
          fi

      - name: Commit and push
        env:
          MESSAGE: ${{ inputs.message }}
        run: |
          git add flatlaf-core/src/main/resources/com/formdev/flatlaf/natives

          if git diff --cached --quiet; then
              echo "::error::Native libraries are unchanged, nothing to commit"
              exit 1
          fi

          # platforms with changed libraries
          CHANGED=$(git diff --cached --name-only)
          PLATFORMS=
          addPlatform() {
              case "$CHANGED" in
                  *"-$1-"*) PLATFORMS="${PLATFORMS:+$PLATFORMS, }$2" ;;
              esac
          }
          addPlatform windows Windows
          addPlatform macos macOS
          addPlatform linux Linux

          # names of changed libraries
          LIBRARIES=$(echo "$CHANGED" | sed 's|.*/|- |')
          echo "::notice::"$(echo "$LIBRARIES" | sed 's|- | |' | tr '\n' ',')

          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR_ID+$GITHUB_ACTOR@users.noreply.github.com"
          git commit -m "$MESSAGE ($PLATFORMS)" -m "$LIBRARIES" -m "$(cat "$RUNNER_TEMP/built-by.txt")"
          git show --stat --format=fuller HEAD
          git push
