# https://docs.github.com/en/actions/tutorials/create-actions/create-a-composite-action#creating-a-composite-action-within-the-same-repository

# cache uses two files:
#
#   - gradle-wrapper-<os>-<arch>-<hash>:
#       contains the Gradle wrapper/distribution (~/.gradle/wrapper)
#       and is updated when the Gradle version changed
#   - gradle-caches-<os>-<arch>-<hash>:
#       contains the Gradle caches (~/.gradle/caches), buildSrc/build and buildSrc/.gradle
#       and is updated when Gradle related files were changed
#       buildSrc/.gradle is needed so that buildSrc tasks are UP-TO-DATE

name: 'Cache Gradle'
runs:
  using: "composite"
  steps:

    - uses: gradle/actions/wrapper-validation@v6

    # compute cache keys once (before the build) and store them in environment variables
    # because the 'key' inputs of actions/cache are evaluated again in its post step (after the build),
    # where hashFiles() may fail; e.g. when building in a container (as root),
    # the runner on the host is not allowed to read some files created by the build
    - name: Compute cache keys
      shell: bash
      run: |
        echo "GRADLE_WRAPPER_CACHE_KEY=gradle-wrapper-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles( 'gradle/wrapper/gradle-wrapper.properties' ) }}" >> "$GITHUB_ENV"
        echo "GRADLE_CACHES_CACHE_KEY=gradle-caches-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles( '**/*.gradle*', 'gradle/**', 'gradle.properties', 'buildSrc/src/**' ) }}" >> "$GITHUB_ENV"

    - name: Cache '.gradle/wrapper'
      uses: actions/cache@v6
      with:
        key: ${{ env.GRADLE_WRAPPER_CACHE_KEY }}
        path: |
          ~/.gradle/wrapper

    - name: Cache '.gradle/caches' and 'buildSrc/build'
      uses: actions/cache@v6
      with:
        key: ${{ env.GRADLE_CACHES_CACHE_KEY }}
        path: |
          ~/.gradle/caches
          buildSrc/build
          buildSrc/.gradle
